[workspace]
resolver = "2"
members = [
  "bb-bin-monkey",
  "bb-bin-cfg-creator",
  "bb-lib-base-api",
  "bb-lib-config",
  "bb-lib-http-listener",
  "bb-lib-nats-streams", 
  "bb-lib-surreal-client",
  "bb-lib-tracing",
  "bb-lib-event",
  "bb-lib-metrics",
]
exclude = [
  "bb-lib-reactor"
]

[workspace.dependencies]
anyhow = "1.0.86"
async-trait = "0.1.80"
clap = { version = "4.5.4", features = ["derive"]}
futures = "0.3.30"
hyper = { version = "1.2.0", features = ["server"]}
hyper-util = { version = "0.1.3"}
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
# server = { version = "0.1.0"}
thiserror = "1.0.58"
tokio = { version = "1.37.0", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = { version = "0.1.40" }
tower = { version = "0.5.1", features = ["buffer"] }
cargo-make = "0.37.11"
pin-project-lite = "0.2.13"
lazy_static = "1.4.0"
rand = "0.8.5"
bytes = "1.6.0"
uuid = { version = "1.8.0", features = ["v4", "serde"] }