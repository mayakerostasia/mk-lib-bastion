[package]
name = "simian-nats-streams"
version = "2.0.2"
edition = "2021"
exclude = [ "logs", ".scratch" ]

[dependencies]
anyhow = { workspace = true }
async-nats = "0.37.0"
bincode = "1.3.3"
bytes = "1.6.0"
futures = { workspace = true }
simian-http-listener = { path = "../simian-http-listener" }
simian-base-api = { path = "../simian-base-api" }
petname = "2.0.2"
rand = { workspace = true }
serde = {  workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.37.0", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tower = { workspace = true }
tracing = { workspace = true }
tokio-util = "0.7.11"
pin-project-lite.workspace = true
async-trait = "0.1.80"

[dev-dependencies]
simian-tracing = { path = "../simian-tracing" }
pin-project-lite.workspace = true
reqwest = { version = "0.12.4", features = ["json"] }