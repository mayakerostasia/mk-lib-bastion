# Prometheus configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'simian-llm-monitor'

# Scrape configurations for different targets
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Your simian-llm app metrics
  - job_name: 'simian-llm'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # OpenTelemetry Collector (if it exposes Prometheus metrics)
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel:8888']
    scrape_interval: 30s
    scrape_timeout: 10s
