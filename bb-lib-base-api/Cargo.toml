[package]
name = "bb-lib-base-api"
version = "2.0.2"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { version = "0.4.38", features = ["serde"] }
clap = { workspace = true, features = ["derive"], optional = true }
futures = { workspace = true }
http-body-util = { version = "0.1.1", optional = true }
hyper = {  workspace = true, features = ["server"], optional = true }
hyper-util = {  workspace = true, optional = true }
reqwest = { version = "0.12.2", features = ["json"]}
serde = {  workspace = true, features = ["derive"] }
serde_json =  { workspace = true }
server = { version = "0.1.0", optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"], optional = true }
uuid = { workspace = true }

[dev-dependencies]
http-body-util = { version = "0.1.1", optional = false }
hyper-util = { workspace = true }
hyper = { workspace = true, features = ["server"], optional = false }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"], optional = false }
 
[features]
echoserver = ["dep:clap", "dep:hyper-util", "dep:tokio", "dep:http-body-util", "dep:hyper", "dep:server"]
insecure = []

[[bin]]
name = "echo-server"
path = "src/bin/echo_server.rs"
required-features = ["echoserver"]
