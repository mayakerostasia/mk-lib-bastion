[package]
name = "cfg_creator"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bb-config = { version = "0.1.0", path = "..", features = ["autotask", "jira", "surreal", "swimlane", "dev"] }
clap = { version = "4.5.4", features = ["derive"] }
serde = "1.0.198"
serde_json = "1.0.116"
serde_yaml = "0.9.34"

[[bin]]
name = "cfg_creator"
path = "cfg_creator.rs"
